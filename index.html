    <script>
        try {
            // Generate PNG icon with canvas for proper PWA support
            const c = document.createElement('canvas');
            c.width = 512; c.height = 512;
            const ctx = c.getContext('2d');
            // Black background (fills entire icon area)
            ctx.fillStyle = '#09090b';
            ctx.fillRect(0, 0, 512, 512);
            // Draw layers icon centered (with maskable safe zone padding)
            ctx.strokeStyle = '#10b981';
            ctx.lineWidth = 28;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(256, 128); ctx.lineTo(128, 200); ctx.lineTo(256, 272); ctx.lineTo(384, 200); ctx.closePath();
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(128, 256); ctx.lineTo(256, 328); ctx.lineTo(384, 256);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(128, 312); ctx.lineTo(256, 384); ctx.lineTo(384, 312);
            ctx.stroke();
            const iconUrl = c.toDataURL('image/png');
            document.getElementById('apple-icon').href = iconUrl;
            document.getElementById('fav-icon').href = iconUrl;
            const manifest = {
                "name": "Gestor de Apps",
                "short_name": "GestorApps",
                "start_url": ".",
                "display": "standalone",
                "background_color": "#09090b",
                "theme_color": "#09090b",
                "orientation": "portrait",
                "icons": [
                    { "src": iconUrl, "sizes": "512x512", "type": "image/png", "purpose": "any maskable" }
                ]
            };
            document.getElementById('my-manifest').href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/json' }));
        } catch (e) { console.error(e); }
    </script>

        // --- FUNCIONES UTILITARIAS ELEVADAS ---
        function timeAgo(dateString) {
            if (!dateString) return 'Recién creado';
            try {
                const date = new Date(dateString);
                if (isNaN(date.getTime())) return 'Fecha desc.';
                const now = new Date();
                const seconds = Math.floor((now - date) / 1000);
                const days = Math.floor(seconds / 86400);
                if (days > 30) return date.toLocaleDateString();
                if (days > 0) return `Hace ${days} día${days > 1 ? 's' : ''}`;
                const hours = Math.floor(seconds / 3600);
                if (hours > 0) return `Hace ${hours} h`;
                const minutes = Math.floor(seconds / 60);
                if (minutes > 0) return `Hace ${minutes} min`;
                return 'Justo ahora';
            } catch (e) { return 'Fecha desc.'; }
        }

        const FEATURE_KEYS = ['isSeparated', 'hasLogin', 'hasDB', 'hasAI', 'hasUI', 'hasLanding', 'hasNotifications', 'hasChat'];

        function sanitizeApp(app) {
            const safeFeatures = { ...app.features };
            FEATURE_KEYS.forEach(k => {
                if (!safeFeatures[k]) safeFeatures[k] = { included: true, done: false, progress: 0, notes: '' };
                else safeFeatures[k] = { included: true, done: false, progress: 0, notes: '', ...safeFeatures[k] };
            });

            let resources = Array.isArray(app.resources) ? app.resources : [];
            if (!resources.length) {
                if (app.repoLink) resources.push({ id: 'legacy_repo', type: 'github', value: app.repoLink });
                if (app.firebaseLink) resources.push({ id: 'legacy_firebase', type: 'firebase', value: app.firebaseLink });
                if (app.masterEmail) resources.push({ id: 'legacy_mail', type: 'mail', value: app.masterEmail });
                if (app.appLink) resources.push({ id: 'legacy_web', type: 'link', value: app.appLink });
            }

            return {
                ...app,
                features: safeFeatures,
                resources: resources,
                notes: Array.isArray(app.notes) ? app.notes : [],
                aiLinks: Array.isArray(app.aiLinks) ? app.aiLinks : [],
                stage: app.stage || 'idea',
                isLocked: app.isLocked === true,
                priority: app.priority || 'medium',
                deadline: app.deadline || null,
                tags: Array.isArray(app.tags) ? app.tags : [],
                functioningLevel: typeof app.functioningLevel === 'number' ? app.functioningLevel : 0,
                potential: typeof app.potential === 'number' ? app.potential : 50,
                version: app.version || (app.stage !== 'idea' ? 'v0.1.0' : ''),
                createdAt: app.createdAt || new Date().toISOString(),
                launchedAt: app.launchedAt || null,
                monetizes: app.monetizes === true
            };
        }

        const FEATURE_LIST = [

        const DonutChart = ({ data, size = 160 }) => {
            const total = data.reduce((acc, d) => acc + d.value, 0);
            let cumulativePercent = 0;

            const getCoordinatesForPercent = (percent) => {
                const x = Math.cos(2 * Math.PI * percent);
                const y = Math.sin(2 * Math.PI * percent);
                return [x, y];
            };

            const slices = data.map(slice => {
                const startPercent = cumulativePercent;
                const slicePercent = total ? slice.value / total : 0;
                cumulativePercent += slicePercent;
                const endPercent = cumulativePercent;

                const [startX, startY] = getCoordinatesForPercent(startPercent);
                const [endX, endY] = getCoordinatesForPercent(endPercent);
                const largeArcFlag = slicePercent > 0.5 ? 1 : 0;

                const pathData = total === 0 ? "" :
                    slicePercent === 1 ?
                        `M 1 0 A 1 1 0 1 1 -1 0 A 1 1 0 1 1 1 0` : // Full circle
                        `M ${startX} ${startY} A 1 1 0 ${largeArcFlag} 1 ${endX} ${endY} L 0 0`;

                return { path: pathData, color: slice.color };
            });

            return (
                <div className="relative flex items-center justify-center" style={{ width: size, height: size }}>
                    <svg viewBox="-1.2 -1.2 2.4 2.4" className="transform -rotate-90 w-full h-full">

                const ideas = fa.filter(a => a.stage === 'idea').length;
                const dev = fa.filter(a => a.stage === 'development').length;
                const prod = fa.filter(a => a.stage === 'production').length;
                const completionRate = total ? Math.round((prod / total) * 100) : 0;

                const statusData = [
                    { label: 'Ideas', value: ideas, color: '#fbbf24' },
                    { label: 'En Curso', value: dev, color: '#22d3ee' },
                    { label: 'En la Calle', value: prod, color: '#34d399' }
                ];

                const priorityData = [
                    { label: 'Alta', value: fa.filter(a => a.priority === 'high').length, color: '#f87171' },
                    { label: 'Media', value: fa.filter(a => a.priority === 'medium').length, color: '#fbbf24' },
                    { label: 'Baja', value: fa.filter(a => a.priority === 'low').length, color: '#60a5fa' }
                ];

                // App type: App vs PWA
                const appCount = fa.filter(a => (a.type || 'App') === 'App').length;
                const pwaCount = fa.filter(a => a.type === 'PWA').length;
                const typeData = [
                    { label: 'App', value: appCount, color: '#818cf8' },
                    { label: 'PWA', value: pwaCount, color: '#c084fc' }
                ];

                // Monetization
                const monetYes = fa.filter(a => a.monetizes === true).length;
                const monetNo = fa.length - monetYes;
                const monetData = [
                    { label: 'Monetiza', value: monetYes, color: '#34d399' },
                    { label: 'No', value: monetNo, color: '#3f3f46' }
                ];

                // Code separated
                const sepYes = fa.filter(a => a.features && a.features.isSeparated && a.features.isSeparated.done).length;
                const sepNo = fa.length - sepYes;
                const codeData = [
                    { label: 'Separado', value: sepYes, color: '#22d3ee' },
                    { label: 'Monolito', value: sepNo, color: '#3f3f46' }
                ];

                // Complexity
                const complexityData = [
                    { label: 'Baja', value: fa.filter(a => a.complexity === 'low').length, color: '#60a5fa' },
                    { label: 'Media', value: fa.filter(a => a.complexity === 'medium').length, color: '#fbbf24' },
                    { label: 'Alta', value: fa.filter(a => a.complexity === 'high').length, color: '#f87171' },
                    { label: 'Extrema', value: fa.filter(a => a.complexity === 'extreme').length, color: '#ef4444' }
                ];

                // Monthly timeline
                const monthMap = {};
                fa.forEach(a => {
                    if (!a.createdAt) return;
                    const d = new Date(a.createdAt);
                    const key = `${d.getFullYear()}-${String(d.getMonth()).padStart(2, '0')}`;
                    if (!monthMap[key]) monthMap[key] = { created: 0, launched: 0, label: `${MONTHS_ES[d.getMonth()]} ${String(d.getFullYear()).slice(2)}` };
                    monthMap[key].created++;
                });
                fa.forEach(a => {
                    if (!a.launchedAt) return;
                    const d = new Date(a.launchedAt);
                    const key = `${d.getFullYear()}-${String(d.getMonth()).padStart(2, '0')}`;
                    if (!monthMap[key]) monthMap[key] = { created: 0, launched: 0, label: `${MONTHS_ES[d.getMonth()]} ${String(d.getFullYear()).slice(2)}` };
                    monthMap[key].launched++;
                });
                const monthlyData = Object.entries(monthMap).sort((a, b) => a[0].localeCompare(b[0])).map(([, v]) => v);

                // Tags
                const tagsCount = {};
                fa.forEach(a => (a.tags || []).forEach(t => tagsCount[t] = (tagsCount[t] || 0) + 1));
                const topTags = Object.entries(tagsCount).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([label, value]) => ({ label, value }));

                return { total, ideas, dev, prod, completionRate, statusData, priorityData, typeData, monetData, codeData, complexityData, monthlyData, topTags };
            }, [filteredApps]);

            const monthMax = Math.max(...stats.monthlyData.map(m => Math.max(m.created, m.launched)), 1);

            return (
                <div className="animate-in fade-in zoom-in-95 duration-300 space-y-6">
                    {/* Period Filter */}
                    <div className="flex items-center justify-between flex-wrap gap-3">
                        <h2 className="text-lg font-bold text-zinc-200 flex items-center gap-2"><Icons.BarChart3 size={20} className="text-indigo-400" /> Panel de Estadísticas</h2>
                        <div className="flex gap-1 bg-zinc-900 rounded-lg p-1 border border-zinc-800">
                            {[{ k: '1m', l: '1 Mes' }, { k: '3m', l: '3 Meses' }, { k: '6m', l: '6 Meses' }, { k: '1y', l: '1 Año' }, { k: 'all', l: 'Todo' }].map(o => (
                                <button key={o.k} onClick={() => setPeriod(o.k)} className={`px-3 py-1.5 rounded-md text-[11px] font-bold transition-all ${period === o.k ? 'bg-indigo-600 text-white shadow' : 'text-zinc-500 hover:text-zinc-300'}`}>{o.l}</button>
                            ))}
                        </div>
                    </div>

                    {/* KPIs */}
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <KpiCard icon={Icons.Layers} label="Total Proyectos" value={stats.total} color="text-zinc-100" bg="bg-zinc-800/50" border="border-zinc-700/50" />
                        <KpiCard icon={Icons.Lightbulb} label="Ideas" value={stats.ideas} color="text-amber-400" bg="bg-amber-500/10" border="border-amber-500/20" />
                        <KpiCard icon={Icons.Rocket} label="En Desarrollo" value={stats.dev} color="text-cyan-400" bg="bg-cyan-500/10" border="border-cyan-500/20" />
                        <KpiCard icon={Icons.Store} label="Lanzados" value={stats.prod} sub={`${stats.completionRate}%`} color="text-emerald-400" bg="bg-emerald-500/10" border="border-emerald-500/20" />
                    </div>

                    {/* Monthly Timeline */}
                    <div className="bg-zinc-900/50 border border-zinc-800/50 rounded-2xl p-6">
                        <h3 className="text-zinc-400 font-bold text-sm uppercase mb-4 tracking-wider flex items-center gap-2"><Icons.Calendar size={16} /> Actividad Mensual</h3>
                        {stats.monthlyData.length === 0 ? (
                            <p className="text-zinc-600 text-xs italic text-center py-8">Sin datos de actividad.</p>
                        ) : (
                            <div className="space-y-4">
                                <div className="flex items-end justify-between gap-1 w-full overflow-x-auto pb-2" style={{ minHeight: 140 }}>
                                    {stats.monthlyData.map((m, i) => (
                                        <div key={i} className="flex-1 min-w-[40px] max-w-[60px] flex flex-col items-center gap-1 group">
                                            <div className="flex gap-0.5 items-end w-full justify-center" style={{ height: 100 }}>
                                                <div className="w-2.5 rounded-t-sm bg-cyan-500 transition-all" style={{ height: `${(m.created / monthMax) * 100}%`, minHeight: m.created ? 4 : 0 }} title={`Creados: ${m.created}`}></div>
                                                <div className="w-2.5 rounded-t-sm bg-emerald-500 transition-all" style={{ height: `${(m.launched / monthMax) * 100}%`, minHeight: m.launched ? 4 : 0 }} title={`Lanzados: ${m.launched}`}></div>
                                            </div>
                                            <span className="text-[9px] font-bold text-zinc-600 group-hover:text-zinc-400 transition-colors">{m.label}</span>
                                        </div>
                                    ))}
                                </div>
                                <div className="flex items-center gap-4 justify-center">
                                    <div className="flex items-center gap-1.5"><div className="w-2.5 h-2.5 rounded-sm bg-cyan-500"></div><span className="text-[10px] text-zinc-400 font-medium">Creados</span></div>
                                    <div className="flex items-center gap-1.5"><div className="w-2.5 h-2.5 rounded-sm bg-emerald-500"></div><span className="text-[10px] text-zinc-400 font-medium">Lanzados</span></div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Row 1: Stage + Priority + Complexity */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bg-zinc-900/50 border border-zinc-800/50 rounded-2xl p-6 flex flex-col items-center">
                            <h3 className="text-zinc-400 font-bold text-sm uppercase mb-4 tracking-wider flex items-center gap-2"><Icons.PieChart size={16} /> Etapas</h3>
                            <DonutChart data={stats.statusData} size={130} />
                            <div className="flex gap-3 mt-4 flex-wrap justify-center">
                                {stats.statusData.map(d => (
                                    <div key={d.label} className="flex items-center gap-1">
                                        <div className="w-2 h-2 rounded-full" style={{ backgroundColor: d.color }}></div>
                                        <span className="text-[10px] text-zinc-400">{d.label}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                        <div className="bg-zinc-900/50 border border-zinc-800/50 rounded-2xl p-6 flex flex-col items-center justify-center">
                            <h3 className="text-zinc-400 font-bold text-sm uppercase mb-4 tracking-wider flex items-center gap-2"><Icons.Zap size={16} /> Prioridades</h3>
                            <BarChart data={stats.priorityData} height={120} />
                        </div>
                        <div className="bg-zinc-900/50 border border-zinc-800/50 rounded-2xl p-6 flex flex-col items-center justify-center">
                            <h3 className="text-zinc-400 font-bold text-sm uppercase mb-4 tracking-wider flex items-center gap-2"><Icons.Activity size={16} /> Complejidad</h3>
                            <BarChart data={stats.complexityData} height={120} />
                        </div>
                    </div>

                    {/* Row 2: Type + Monetization + Code Separation + Tags */}
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
                        <div className="bg-zinc-900/50 border border-zinc-800/50 rounded-2xl p-5 flex flex-col items-center">
                            <MiniDonut data={stats.typeData} label="Tipo de App" />
                        </div>
                        <div className="bg-zinc-900/50 border border-zinc-800/50 rounded-2xl p-5 flex flex-col items-center">
                            <MiniDonut data={stats.monetData} label="Monetización" />
                        </div>
                        <div className="bg-zinc-900/50 border border-zinc-800/50 rounded-2xl p-5 flex flex-col items-center">
                            <MiniDonut data={stats.codeData} label="Código" />
                        </div>
                        <div className="bg-zinc-900/50 border border-zinc-800/50 rounded-2xl p-5 flex flex-col">
                            <h3 className="text-zinc-400 font-bold text-[10px] uppercase mb-3 tracking-wider flex items-center gap-1"><Icons.Tag size={12} /> Top Tags</h3>
                            <div className="space-y-2 flex-1">
                                {stats.topTags.map((tag, i) => (
                                    <div key={tag.label} className="flex items-center gap-1.5">
                                        <span className="text-[10px] font-mono text-zinc-600 w-3">{i + 1}.</span>
                                        <div className="flex-1">
                                            <div className="flex justify-between text-[10px] mb-0.5">
                                                <span className="text-zinc-300">{tag.label}</span>
                                                <span className="text-zinc-600">{tag.value}</span>
                                            </div>
                                            <div className="h-1 w-full bg-zinc-800 rounded-full overflow-hidden">
                                                <div className="h-full bg-indigo-500 rounded-full transition-all" style={{ width: `${stats.total ? (tag.value / stats.total) * 100 : 0}%` }}></div>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                                {stats.topTags.length === 0 && <p className="text-zinc-700 text-[10px] italic text-center py-4">Sin tags.</p>}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const AppHeader = ({ stats, isFormOpen, setIsFormOpen, activeTab, user, onLogout }) => (
            <header className="bg-gradient-to-r from-zinc-900 via-slate-900 to-zinc-900 border-b border-zinc-800/50 sticky top-0 z-30 shadow-2xl shadow-black/50">
                <div className="w-full max-w-[95%] mx-auto px-4 py-2 flex flex-row justify-between items-center gap-4 h-16">
                    <div className="flex items-center gap-3">
                        <div className="relative group">
                            <div className="absolute -inset-1 bg-gradient-to-r from-cyan-500 to-emerald-500 rounded-lg blur opacity-25 group-hover:opacity-50 transition duration-1000"></div>
                            <div className="relative w-9 h-9 sm:w-10 sm:h-10 bg-zinc-950 rounded-lg flex items-center justify-center border border-zinc-800 shadow-xl"><Icons.Layers size={20} className="text-emerald-500" /></div>
                        </div>
                    </div>
                    <div className="flex gap-4 justify-center items-center">
                        <HeaderStat icon={Icons.Lightbulb} count={stats.ideas} color="text-amber-400" />
                        <HeaderStat icon={Icons.Rocket} count={stats.apps} color="text-cyan-400" />
                        <HeaderStat icon={Icons.Store} count={stats.prod} color="text-emerald-400" />
                    </div>
                    <div className="flex items-center gap-2">
                        {activeTab !== 'production' && (
                            <button onClick={() => setIsFormOpen(!isFormOpen)} className={`group flex items-center justify-center w-10 h-10 rounded-xl font-bold text-sm transition-all shadow-lg ${isFormOpen ? 'bg-zinc-800 text-zinc-400 hover:bg-zinc-700' : 'bg-emerald-600 text-white hover:bg-emerald-500 hover:shadow-emerald-500/20'}`}>
                                {isFormOpen ? <Icons.X size={20} /> : <Icons.Plus size={20} />}
                            </button>
                        )}
                        {user && user.photoURL && <img src={user.photoURL} className="w-8 h-8 rounded-full border border-zinc-700" referrerPolicy="no-referrer" title={user.displayName || user.email} />}
                        {user && <button onClick={onLogout} title="Cerrar sesión" className="p-2 rounded-lg bg-zinc-800/50 text-zinc-500 hover:text-red-400 hover:bg-zinc-800 border border-zinc-700/50 transition-colors"><Icons.LogOut size={16} /></button>}
                    </div>
                </div>
            </header>
        );

        // --- SUB-COMPONENTE: NotesSection ---
        const NotesSection = ({ notes, isLocked, isArchived, onAddNote, onDeleteNote }) => {
            const [newNote, setNewNote] = useState('');
            const handleSubmit = (e) => { e.preventDefault(); if (!newNote.trim() || isLocked) return; onAddNote(newNote); setNewNote(''); };
            return (
                <div className="mt-4 pt-4 border-t border-zinc-800/50">
                    <div className="flex items-center gap-2 text-xs text-zinc-500 mb-2 uppercase tracking-wider font-semibold"><Icons.ListOrdered size={14} /> Notas</div>
                    <div className="space-y-1.5 mb-2 max-h-24 overflow-y-auto pr-1 scrollbar-thin scrollbar-thumb-zinc-700">
                        {notes && notes.length > 0 ? (
                            notes.map((note, index) => (
                                <div key={note.id} className="group flex items-start gap-2 text-xs text-zinc-300">
                                    <span className="text-zinc-600 font-mono select-none">{index + 1}.</span>
                                    <div className="flex-1"><p className="break-words">{note.text}</p>{note.createdAt && <span className="text-[9px] text-zinc-600">{timeAgo(note.createdAt)}</span>}</div>
                                    {!isLocked && !isArchived && <button onClick={() => onDeleteNote(note.id)} className="opacity-0 group-hover:opacity-100 text-zinc-600 hover:text-red-400 transition-opacity"><Icons.X size={12} /></button>}
                                </div>
                            ))
                        ) : <span className="text-xs text-zinc-700 italic pl-1">Sin notas.</span>}
                    </div>
                    {!isLocked && !isArchived && (
                        <form onSubmit={handleSubmit} className="flex gap-2">
                            <input type="text" value={newNote} onChange={(e) => setNewNote(e.target.value)} placeholder="Nueva nota..." className="flex-1 bg-zinc-950 border border-zinc-800 rounded px-2 py-1 text-xs text-zinc-200 focus:border-zinc-600 focus:outline-none" />
                            <button type="submit" disabled={!newNote.trim()} className="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 p-1 rounded transition-colors"><Icons.Plus size={14} /></button>
                        </form>
                    )}
                </div>
            );
        };

        const AppCard = ({ app, onDelete, onUpdate, onPromote, onArchive, onRevert, onLaunch, onDragStart }) => {
            const [showAiLinks, setShowAiLinks] = useState(false);
            const [showLinkForm, setShowLinkForm] = useState(false);
            const [newLinkUrl, setNewLinkUrl] = useState('');
            const [newLinkLabel, setNewLinkLabel] = useState('');
            const [newLinkPlatform, setNewLinkPlatform] = useState('Gemini');
            const [isTagFormOpen, setIsTagFormOpen] = useState(false);
            const [newTag, setNewTag] = useState('');
            const [isDateFormOpen, setIsDateFormOpen] = useState(false);

            const isIdea = app.stage === 'idea';
            const isDev = app.stage === 'development';
            const isProd = app.stage === 'production';
            const isArchived = app.ideaStatus === 'archived' || app.ideaStatus === 'converted';

            const weightedScore = useMemo(() => {
                if (isIdea) return app.potential || 0;
                if (!app.features) return 0;
                let featuresScore = 0;
                const activeFeatures = FEATURE_LIST.filter(f => app.features[f.key]?.included);
                if (activeFeatures.length > 0) {
                    const doneFeatures = activeFeatures.filter(f => app.features[f.key]?.done).length;
                    featuresScore = (doneFeatures / activeFeatures.length) * 100;
                }
                const functioningScore = app.functioningLevel || 0;
                return Math.round((featuresScore * 0.4) + (functioningScore * 0.6));
            }, [app, isIdea]);

            const toggleLock = () => onUpdate(app.id, { isLocked: !app.isLocked });
            const handleAddNote = (text) => { onUpdate(app.id, { notes: [...(app.notes || []), { id: crypto.randomUUID(), text, createdAt: new Date().toISOString() }] }); };
            const handleDeleteNote = (nid) => { if (!app.isLocked) onUpdate(app.id, { notes: app.notes.filter(n => n.id !== nid) }); };
            const addAiLink = (e) => { e.preventDefault(); if (!newLinkUrl.trim() || app.isLocked) return; onUpdate(app.id, { aiLinks: [...(app.aiLinks || []), { id: crypto.randomUUID(), platform: newLinkPlatform, url: newLinkUrl, label: newLinkLabel || 'Chat Log' }] }); setNewLinkUrl(''); setNewLinkLabel(''); setShowLinkForm(false); };
            const removeAiLink = (lid) => { if (!app.isLocked) onUpdate(app.id, { aiLinks: (app.aiLinks || []).filter(l => l.id !== lid) }); };

            const handlePriorityClick = () => {
                if (app.isLocked) return;
                const next = { low: 'medium', medium: 'high', high: 'low' };
                onUpdate(app.id, { priority: next[app.priority] || 'medium' });
            };

            const priorityConfig = {
                high: { color: 'text-red-400 bg-red-400/10 border-red-400/20', icon: Icons.Zap, label: 'Alta' },
                medium: { color: 'text-amber-400 bg-amber-400/10 border-amber-400/20', icon: Icons.Activity, label: 'Media' },
                low: { color: 'text-blue-400 bg-blue-400/10 border-blue-400/20', icon: Icons.ZapOff, label: 'Baja' }
            };

            const pConfig = priorityConfig[app.priority] || priorityConfig.medium;
            const PIcon = pConfig.icon;

            const handleAddTag = (e) => {
                e.preventDefault(); if (!newTag.trim()) return;
                const tag = newTag.trim();
                if (!app.tags?.includes(tag)) onUpdate(app.id, { tags: [...(app.tags || []), tag] });
                setNewTag(''); setIsTagFormOpen(false);
            };

            const handleDeleteTag = (tag) => {
                onUpdate(app.id, { tags: (app.tags || []).filter(t => t !== tag) });
            };

            const deadlineStatus = useMemo(() => {
                if (!app.deadline) return null;
                const now = new Date();
                const due = new Date(app.deadline);
                const diff = due - now;
                const isOverdue = diff < 0;
                const isSoon = diff > 0 && diff < 24 * 60 * 60 * 1000;

                return { isOverdue, isSoon, due, timeStr: due.toLocaleString() };
            }, [app.deadline]);



            return (
                <div
                    draggable={!app.isLocked}
                    onDragStart={(e) => onDragStart && onDragStart(e, app.id)}
                    className={`relative w-full rounded-xl p-5 transition-all duration-500 flex flex-col h-fit ${app.isLocked ? 'bg-zinc-900 border-2 border-amber-500/40 shadow-[0_0_20px_rgba(245,158,11,0.15)] z-10 cursor-not-allowed' : isArchived ? 'bg-zinc-950 border border-zinc-900 opacity-60 grayscale' : 'bg-zinc-900 border border-zinc-800 hover:border-zinc-600 hover:shadow-xl hover:shadow-zinc-950/50 cursor-grab active:cursor-grabbing'}`}
                >
                    <div className="flex justify-between items-start mb-4">
                        <div className="w-full pr-2">
                            <div className="flex items-center gap-2 mb-1 flex-wrap">
                                {isIdea && <Icons.Lightbulb size={18} className={isArchived ? "text-zinc-600" : "text-amber-400"} />}
                                {isDev && <Icons.Rocket size={18} className="text-cyan-400" />}
                                {isProd && <Icons.Store size={18} className="text-emerald-400" />}
                                <h3 className={`text-xl font-bold tracking-tight leading-tight break-words ${app.isLocked ? 'text-amber-100' : isArchived ? 'text-zinc-500' : 'text-zinc-100'}`}>{app.name}</h3>
                                {isIdea && !isArchived && (
                                    <button onClick={handlePriorityClick} className={`flex items-center gap-1 px-1.5 py-0.5 rounded text-[10px] font-medium border ${pConfig.color} transition-colors hover:brightness-110`} title="Cambiar prioridad">
                                        <PIcon size={10} /> {pConfig.label}
                                    </button>
                                )}
                                {isDev && !isArchived && (
                                    <button onClick={handlePriorityClick} className={`flex items-center gap-1 px-1.5 py-0.5 rounded text-[10px] font-medium border ${pConfig.color} transition-colors hover:brightness-110`} title="Cambiar prioridad">
                                        <PIcon size={10} /> {pConfig.label}
                                    </button>
                                )}
                            </div>
                            <div className="flex flex-wrap gap-1.5 items-center mt-2 mb-2">
                                {(app.tags || []).map(tag => (
                                    <span key={tag} className="flex items-center gap-1 text-[10px] bg-zinc-800 text-zinc-300 px-1.5 py-0.5 rounded border border-zinc-700 group/tag">
                                        {tag}
                                        {!app.isLocked && <button onClick={() => handleDeleteTag(tag)} className="hover:text-red-400 hidden group-hover/tag:block"><Icons.X size={8} /></button>}
                                    </span>
                                ))}
                                {!app.isLocked && !isTagFormOpen && (
                                    <button onClick={() => setIsTagFormOpen(true)} className="text-[10px] text-zinc-500 hover:text-cyan-400 flex items-center gap-1 px-1.5 py-0.5 rounded hover:bg-zinc-800 transition-colors border border-transparent hover:border-zinc-700" title="Agregar etiqueta">
                                        <Icons.Plus size={12} /> <span className="font-medium">Tag</span>
                                    </button>
                                )}
                                {!app.isLocked && !isDateFormOpen && (
                                    <button onClick={() => setIsDateFormOpen(true)} className={`text-[10px] flex items-center gap-1 px-1.5 py-0.5 rounded transition-colors border ${app.deadline ? (deadlineStatus.isOverdue ? 'text-red-400 border-red-500/30 bg-red-500/10 animate-pulse' : deadlineStatus.isSoon ? 'text-amber-400 border-amber-500/30 bg-amber-500/10' : 'text-emerald-400 border-emerald-500/30 bg-emerald-500/10') : 'text-zinc-500 hover:text-purple-400 border-transparent hover:border-zinc-700 hover:bg-zinc-800'}`} title={app.deadline ? `Vence: ${deadlineStatus.timeStr}` : "Establecer fecha límite"}>
                                        <Icons.Calendar size={12} />
                                        {app.deadline ? <span className="font-mono font-medium">{deadlineStatus.isOverdue ? 'VENCIDO' : deadlineStatus.isSoon ? 'HOY/MAÑANA' : new Date(app.deadline).toLocaleDateString()}</span> : <span className="font-medium">Deadline</span>}
                                    </button>
                                )}
                                {isDateFormOpen && (
                                    <div className="flex items-center gap-1 bg-zinc-950 p-1 rounded border border-zinc-800 animate-in fade-in zoom-in-95">
                                        <input type="datetime-local" value={app.deadline || ''} onChange={(e) => onUpdate(app.id, { deadline: e.target.value })} className="bg-zinc-900 border border-zinc-800 rounded px-1 py-0.5 text-[10px] text-zinc-200 focus:outline-none focus:border-zinc-600" />

                    {isDev && (

                            <div className="p-3 bg-zinc-950/50 rounded-lg border border-zinc-800/50">

                                <div className="flex items-center justify-between mt-3 pt-3 border-t border-zinc-800/50 mb-2">

                                    <input type="text" value={app.version || ''} onChange={(e) => !app.isLocked && onUpdate(app.id, { version: e.target.value })} placeholder="v0.0.0" disabled={app.isLocked} className="bg-zinc-900 text-xs text-zinc-300 border border-zinc-800 rounded px-2 py-1 w-24 text-right focus:outline-none focus:border-cyan-500/50" />

                            <div className="grid grid-cols-2 gap-2 mt-1">
                                {FEATURE_LIST.map((feature) => {

                    {isProd && (

                                <div className="grid grid-cols-2 gap-4">

                                        <label className="text-[10px] uppercase font-bold text-zinc-500 mb-1 flex items-center gap-1"><Icons.DollarSign size={10} /> Monetiza</label>

                                            <ToggleSwitch checked={app.monetizes || false} onChange={(val) => onUpdate(app.id, { monetizes: val })} disabled={app.isLocked} />
                                            <span className={`text-xs font-bold ${app.monetizes ? 'text-emerald-400' : 'text-zinc-600'}`}>{app.monetizes ? 'SI' : 'NO'}</span>
                                        </div>

                                        <label className="text-[10px] uppercase font-bold text-zinc-500 mb-1 flex items-center gap-1"><Icons.BarChart3 size={10} /> Complejidad</label>
                                        <select value={app.complexity || 'medium'} onChange={(e) => onUpdate(app.id, { complexity: e.target.value })} disabled={app.isLocked} className="bg-zinc-900 text-xs text-zinc-300 border border-zinc-800 rounded px-2 py-1 w-full focus:outline-none">
                                            {COMPLEXITY_OPTIONS.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}

                                    <label className="text-[10px] uppercase font-bold text-zinc-500 mb-1 flex items-center gap-1"><Icons.Map size={10} /> Alcance</label>

                                        {REACH_OPTIONS.map(opt => (
                                            <button key={opt.value} onClick={() => !app.isLocked && onUpdate(app.id, { reach: opt.value })} disabled={app.isLocked} className={`flex-1 text-[10px] font-bold py-1.5 rounded transition-colors ${app.reach === opt.value ? 'bg-zinc-800 text-white shadow-sm' : 'text-zinc-600 hover:text-zinc-400'}`}>{opt.label}</button>
                                        ))}
                                    </div>
                                </div>
                                <div>
                                    <label className="text-[10px] uppercase font-bold text-zinc-500 mb-1 flex items-center gap-1"><Icons.Tag size={10} /> Versión de Lanzamiento</label>
                                    <div className="w-full bg-zinc-900/50 border border-zinc-800/50 rounded-lg px-3 py-2 text-xs text-emerald-400 font-mono font-bold flex items-center justify-between">
                                        <span>{app.version || 'v1.0.0'}</span>
                                        <Icons.CheckCircle2 size={12} />
                                    </div>

                                <DynamicResourceList resources={app.resources} onUpdate={(res) => onUpdate(app.id, { resources: res })} isLocked={app.isLocked} />

                    )}

                    <NotesSection notes={app.notes} isLocked={app.isLocked} isArchived={isArchived} onAddNote={handleAddNote} onDeleteNote={handleDeleteNote} />
                </div>
            );
        };

        function App() {
            const [activeTab, setActiveTab] = useState('apps');
            const [apps, setApps] = useState([]);
            const [user, setUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);
            const [firestoreReady, setFirestoreReady] = useState(false);
            const [selectedTag, setSelectedTag] = useState('');
            const saveTimeoutRef = useRef(null);

            const allTags = useMemo(() => {
                const tags = new Set();
                apps.forEach(app => (app.tags || []).forEach(t => tags.add(t)));
                return Array.from(tags).sort();
            }, [apps]);
            const [showLanding, setShowLanding] = useState(true);
            const [isFormOpen, setIsFormOpen] = useState(false);
            const [newAppName, setNewAppName] = useState('');
            const [newAppType, setNewAppType] = useState('App');
            const [newAppDesc, setNewAppDesc] = useState('');
            const [viewMode, setViewMode] = useState('list'); // 'list' | 'board'
            const [draggedAppId, setDraggedAppId] = useState(null);
            const [newAppVersion, setNewAppVersion] = useState('v0.1.0');
            const [appToDelete, setAppToDelete] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [pendingAction, setPendingAction] = useState(null);

            // --- Firebase Auth Listener ---
            useEffect(() => {
                const unsubAuth = fbAuth.onAuthStateChanged((u) => {
                    setUser(u);
                    setAuthLoading(false);
                });
                return () => unsubAuth();
            }, []);

            // --- Firestore real-time sync ---
            useEffect(() => {
                if (!user) { setFirestoreReady(false); return; }
                const docRef = fbDb.collection('users').doc(user.uid);
                const unsub = docRef.onSnapshot((snap) => {
                    if (snap.exists) {
                        const data = snap.data();
                        if (data.apps && Array.isArray(data.apps)) {
                            setApps(data.apps.map(sanitizeApp));
                        }
                    } else {
                        // First time user — try migrating from localStorage
                        try {
                            const saved = localStorage.getItem(STORAGE_KEY);
                            if (saved) {
                                const parsed = JSON.parse(saved);
                                if (Array.isArray(parsed) && parsed.length > 0) {
                                    docRef.set({ apps: parsed });
                                    setApps(parsed.map(sanitizeApp));
                                    setFirestoreReady(true);
                                    return;
                                }
                            }
                        } catch (e) { }
                        docRef.set({ apps: INITIAL_DATA });
                        setApps(INITIAL_DATA);
                    }
                    setFirestoreReady(true);
                });
                return () => unsub();
            }, [user]);

            // --- Save to Firestore when apps change ---


            useEffect(() => {
                if (!user || !firestoreReady) return;
                // Debounce saves to avoid excessive writes
                if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);
                saveTimeoutRef.current = setTimeout(() => {
                    fbDb.collection('users').doc(user.uid).set({ apps });
                }, 500);
                return () => { if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current); };
            }, [apps, user, firestoreReady]);

            // --- Notifications Logic ---
            useEffect(() => {
                if ('Notification' in window && Notification.permission === 'default') {
                    Notification.requestPermission();
                }
                const interval = setInterval(() => {
                    const now = new Date();
                    apps.forEach(app => {
                        if (app.deadline && !app.notified) {
                            const due = new Date(app.deadline);
                            if (due <= now && (now - due) < 60000) { // Notify only within first minute of due time
                                if (Notification.permission === 'granted') {
                                    new Notification(`¡Se cumplió el plazo!`, { body: `El proyecto "${app.name}" ha alcanzado su fecha límite.`, icon: 'https://cdn-icons-png.flaticon.com/512/3774/3774780.png' });
                                }
                            }
                        }
                    });
                }, 30000); // Check every 30s
                return () => clearInterval(interval);
            }, [apps]);

            const handleGoogleLogin = async () => {
                try { await fbAuth.signInWithPopup(googleProvider); } catch (e) { if (e.code !== 'auth/popup-closed-by-user') alert('Error al iniciar sesión: ' + e.message); }
            };
            const handleLogout = async () => {
                await fbAuth.signOut();
                setApps([]);
                setShowLanding(true);
                setFirestoreReady(false);
            };
            const handleEnterApp = () => { setShowLanding(false); };

            const handleAddIdea = (e) => {
                e.preventDefault(); if (!newAppName.trim()) return;
                const newIdea = sanitizeApp({ id: crypto.randomUUID(), createdAt: new Date().toISOString(), name: newAppName, type: newAppType, stage: 'idea', ideaStatus: 'active', description: newAppDesc, potential: 50 });
                setApps([newIdea, ...apps]); setNewAppName(''); setNewAppDesc(''); setIsFormOpen(false);
            };

            const handlePromoteIdea = (idea) => {
                const newApp = sanitizeApp({ ...idea, id: crypto.randomUUID(), createdAt: new Date().toISOString(), stage: 'development', ideaStatus: undefined, version: 'v0.1.0', functioningLevel: 0, isLocked: false, isTesting: false, complexity: 'medium' });
                const updatedApps = apps.map(a => a.id === idea.id ? { ...a, ideaStatus: 'converted', isLocked: true } : a);
                setApps([newApp, ...updatedApps]); setActiveTab('apps');
            };

            const handleLaunchApp = (app) => {
                setPendingAction({
                    title: '¿Lanzar a Producción?', message: `Estás por lanzar "${app.name}" a la calle.`, action: () => {
                        const prodApp = { ...app, stage: 'production', launchedAt: new Date().toISOString(), isLocked: false, isTesting: false, monetizes: false, reach: 'local', playStoreLink: '', pwaLink: app.appLink || '' };
                        setApps(apps.map(a => a.id === app.id ? prodApp : a));
                        setActiveTab('production');
                        setPendingAction(null);
                    }
                });
            };

            const handleArchiveIdea = (idea) => {
                setPendingAction({
                    title: '¿Archivar idea?', message: `Estás por archivar "${idea.name}".`, action: () => {
                        setApps(apps.map(a => a.id === idea.id ? { ...a, ideaStatus: 'archived', isLocked: true } : a));
                        setPendingAction(null);
                    }
                });
            };
            const handleRevertIdea = (idea) => setApps(apps.map(a => a.id === idea.id ? { ...a, ideaStatus: 'active', isLocked: false } : a));

            const handleExportData = () => {
                const data = JSON.stringify(apps, null, 2);
                const blob = new Blob([data], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = `gestor_apps_backup_${new Date().toISOString().slice(0, 10)}.json`;
                a.click(); URL.revokeObjectURL(url);
            };

            const handleImportData = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const parsed = JSON.parse(ev.target.result);
                        if (!Array.isArray(parsed)) throw new Error('Formato inválido');
                        setPendingAction({
                            title: '¿Importar datos?', message: `Se van a reemplazar tus ${apps.length} apps actuales con ${parsed.length} apps del archivo. Esta acción no se puede deshacer.`, action: () => {
                                setApps(parsed.map(sanitizeApp));
                                setPendingAction(null);
                            }
                        });
                    } catch (err) { alert('Error al leer el archivo: ' + err.message); }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            const handleAddApp = (e) => {
                e.preventDefault(); if (!newAppName.trim()) return;
                const newApp = sanitizeApp({ id: crypto.randomUUID(), createdAt: new Date().toISOString(), name: newAppName, type: newAppType, stage: 'development', isLocked: false, functioningLevel: 50, version: newAppVersion, isTesting: false, complexity: 'medium' });
                setApps([newApp, ...apps]); setNewAppName(''); setNewAppVersion('v0.1.0'); setIsFormOpen(false);
            };



            const handleUpdateApp = (appId, updates) => setApps(apps.map(a => (a.id === appId ? { ...a, ...updates } : a)));

            // --- Drag & Drop Handlers ---
            const handleDragStart = (e, appId) => {
                setDraggedAppId(appId);
                e.dataTransfer.effectAllowed = 'move';
                // Ghost image styling could go here
            };

            const handleDragOver = (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
            };

            const handleDrop = (e, targetStage) => {
                e.preventDefault();
                if (!draggedAppId) return;

                const app = apps.find(a => a.id === draggedAppId);
                if (app && app.stage !== targetStage && !app.isLocked) {
                    const updates = { stage: targetStage };
                    // Auto-set version if moving to development/production and doesn't have one
                    if (targetStage !== 'idea' && !app.version) updates.version = 'v0.1.0';
                    // Auto-set initial priority/complexity if missing
                    if (targetStage === 'development' && !app.complexity) updates.complexity = 'medium';

                    handleUpdateApp(draggedAppId, updates);
                }
                setDraggedAppId(null);
            };

            const stats = useMemo(() => ({
                ideas: apps.filter(a => a.stage === 'idea' && a.ideaStatus === 'active').length,
                apps: apps.filter(a => a.stage === 'development').length,
                prod: apps.filter(a => a.stage === 'production').length
            }), [apps]);



            const kanbanColumns = useMemo(() => {
                const filterAndSort = (stage) => apps
                    .filter(a => a.stage === stage)
                    .filter(a => !searchQuery.trim() || a.name.toLowerCase().includes(searchQuery.toLowerCase()))
                    .filter(a => !selectedTag || (a.tags || []).includes(selectedTag))
                    .sort((a, b) => {
                        const pMap = { high: 3, medium: 2, low: 1 };
                        return (pMap[b.priority] || 2) - (pMap[a.priority] || 2) || a.name.localeCompare(b.name);
                    });

                return {
                    idea: { title: 'Ideas / Conceptos', icon: Icons.Lightbulb, color: 'text-amber-400', bg: 'bg-amber-500/5', border: 'border-amber-500/20', items: filterAndSort('idea') },
                    development: { title: 'En Desarrollo', icon: Icons.Rocket, color: 'text-cyan-400', bg: 'bg-cyan-500/5', border: 'border-cyan-500/20', items: filterAndSort('development') },
                    production: { title: 'En la Calle', icon: Icons.Store, color: 'text-emerald-400', bg: 'bg-emerald-500/5', border: 'border-emerald-500/20', items: filterAndSort('production') }
                };
            }, [apps, searchQuery, selectedTag]);

            const visibleItems = useMemo(() => {
                let items = [];
                if (activeTab === 'ideas') {
                    items = apps.filter(a => a.stage === 'idea');
                } else if (activeTab === 'apps') {
                    items = apps.filter(a => a.stage === 'development');
                } else if (activeTab === 'production') {
                    items = apps.filter(a => a.stage === 'production');
                }

                // Filter by search query
                if (searchQuery.trim()) {
                    const q = searchQuery.toLowerCase();
                    items = items.filter(a => a.name.toLowerCase().includes(q));
                }

                // Filter by selected tag
                if (selectedTag) {
                    items = items.filter(a => (a.tags || []).includes(selectedTag));
                }

                // Global Sorting Logic
                return items.sort((a, b) => {
                    // 1. ideas active status (only for ideas tab)
                    if (activeTab === 'ideas') {
                        if (a.ideaStatus === 'active' && b.ideaStatus !== 'active') return -1;
                        if (a.ideaStatus !== 'active' && b.ideaStatus === 'active') return 1;
                    }

                    // 2. Priority (High > Medium > Low)
                    const pMap = { high: 3, medium: 2, low: 1 };
                    const pA = pMap[a.priority] || 2;
                    const pB = pMap[b.priority] || 2;
                    if (pA !== pB) return pB - pA; // Descending priority

                    // 3. Name (A-Z)
                    return a.name.localeCompare(b.name);
                });
            }, [apps, activeTab, searchQuery, selectedTag]);

            return (
                <div className="min-h-screen bg-zinc-950 text-zinc-100 font-sans selection:bg-cyan-500/30 selection:text-cyan-100 pb-20">
                    {showLanding && <LandingPage onEnter={handleEnterApp} onGoogleLogin={handleGoogleLogin} user={user} authLoading={authLoading} />}
                    <AppHeader stats={stats} isFormOpen={isFormOpen} setIsFormOpen={setIsFormOpen} activeTab={activeTab} user={user} onLogout={handleLogout} />

                    <div className="w-full max-w-[1600px] mx-auto px-4 sm:px-6 mt-6">
                        <div className="flex flex-col md:flex-row gap-3">
                            <div className="flex gap-2 bg-zinc-900/50 p-1.5 rounded-xl border border-zinc-800/50 w-full md:w-fit backdrop-blur-sm overflow-x-auto">
                                {viewMode === 'list' ? (
                                    <>
                                        <button onClick={() => setActiveTab('ideas')} className={`flex-1 md:flex-none px-4 sm:px-6 py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-2 transition-all whitespace-nowrap ${activeTab === 'ideas' ? 'bg-zinc-800 text-amber-400 shadow-lg ring-1 ring-zinc-700' : 'text-zinc-500 hover:text-zinc-300'}`}><Icons.Lightbulb size={16} /> Ideas</button>
                                        <button onClick={() => setActiveTab('apps')} className={`flex-1 md:flex-none px-4 sm:px-6 py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-2 transition-all whitespace-nowrap ${activeTab === 'apps' ? 'bg-zinc-800 text-cyan-400 shadow-lg ring-1 ring-zinc-700' : 'text-zinc-500 hover:text-zinc-300'}`}><Icons.Rocket size={16} /> En Curso</button>
                                        <button onClick={() => setActiveTab('production')} className={`flex-1 md:flex-none px-4 sm:px-6 py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-2 transition-all whitespace-nowrap ${activeTab === 'production' ? 'bg-zinc-800 text-emerald-400 shadow-lg ring-1 ring-zinc-700' : 'text-zinc-500 hover:text-zinc-300'}`}><Icons.Store size={16} /> En la Calle</button>
                                    </>
                                ) : viewMode === 'board' ? (
                                    <span className="px-4 py-2 text-sm font-bold text-zinc-300 flex items-center gap-2"><Icons.Layout size={16} /> Tablero Kanban</span>
                                ) : (
                                    <span className="px-4 py-2 text-sm font-bold text-zinc-300 flex items-center gap-2"><Icons.BarChart3 size={16} /> Panel de Estadísticas</span>
                                )}
                            </div>
                            <div className="flex gap-2 items-center flex-1 overflow-x-auto pb-1 md:pb-0">
                                <div className="flex bg-zinc-900/50 p-1 rounded-xl border border-zinc-800/50">
                                    <button onClick={() => setViewMode('list')} className={`p-2 rounded-lg transition-all ${viewMode === 'list' ? 'bg-zinc-700 text-zinc-100 shadow' : 'text-zinc-500 hover:text-zinc-300'}`} title="Vista Lista"><Icons.ListOrdered size={16} /></button>
                                    <button onClick={() => setViewMode('board')} className={`p-2 rounded-lg transition-all ${viewMode === 'board' ? 'bg-zinc-700 text-zinc-100 shadow' : 'text-zinc-500 hover:text-zinc-300'}`} title="Vista Tablero"><Icons.Layout size={16} /></button>
                                    <button onClick={() => setViewMode('dashboard')} className={`p-2 rounded-lg transition-all ${viewMode === 'dashboard' ? 'bg-zinc-700 text-zinc-100 shadow' : 'text-zinc-500 hover:text-zinc-300'}`} title="Estadísticas"><Icons.BarChart3 size={16} /></button>
                                </div>
                                <div className="relative flex-1 max-w-sm min-w-[200px]">
                                    <Icons.Search size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-600" />
                                    <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="Buscar app..." className="w-full bg-zinc-900/50 border border-zinc-800/50 rounded-xl pl-9 pr-3 py-2.5 text-sm text-zinc-300 focus:outline-none focus:border-zinc-600 placeholder-zinc-700" />
                                </div>
                                <select value={selectedTag} onChange={(e) => setSelectedTag(e.target.value)} className="bg-zinc-900/50 border border-zinc-800/50 rounded-xl px-3 py-2.5 text-sm text-zinc-300 focus:outline-none focus:border-zinc-600 max-w-[120px]">
                                    <option value="">Labels...</option>
                                    {allTags.map(tag => <option key={tag} value={tag}>{tag}</option>)}
                                </select>
                                <button onClick={handleExportData} title="Exportar backup" className="p-2.5 bg-zinc-900/50 border border-zinc-800/50 rounded-xl text-zinc-500 hover:text-emerald-400 hover:border-emerald-500/30 transition-colors"><Icons.Download size={16} /></button>
                                <label title="Importar backup" className="p-2.5 bg-zinc-900/50 border border-zinc-800/50 rounded-xl text-zinc-500 hover:text-cyan-400 hover:border-cyan-500/30 transition-colors cursor-pointer">
                                    <Icons.Upload size={16} />
                                    <input type="file" accept=".json" onChange={handleImportData} className="hidden" />
                                </label>
                            </div>
                        </div>
                    </div>

                    <main className="w-full max-w-[1600px] mx-auto px-4 sm:px-6 mt-6 pb-20">
                        {isFormOpen && activeTab !== 'production' && viewMode === 'list' && (
                            <div className="mb-8 animate-in slide-in-from-top-4 fade-in duration-300 max-w-2xl">
                                <form onSubmit={activeTab === 'ideas' ? handleAddIdea : handleAddApp} className="bg-zinc-900/80 backdrop-blur-md border border-zinc-800 p-6 sm:p-8 rounded-2xl shadow-2xl relative overflow-hidden">
                                    <div className={`absolute top-0 left-0 w-1 h-full bg-gradient-to-b ${activeTab === 'ideas' ? 'from-amber-400 to-orange-500' : 'from-cyan-400 to-blue-500'}`}></div>
                                    <h2 className="text-lg font-bold text-white mb-6 flex items-center gap-2">{activeTab === 'ideas' ? <><Icons.Lightbulb className="text-amber-400" /> Registrar Nueva Idea</> : <><Icons.Rocket className="text-cyan-400" /> Iniciar Proyecto</>}</h2>
                                    <div className="flex flex-col gap-6">
                                        <div className="flex flex-col sm:flex-row gap-6 items-end">
                                            <div className="flex-1 w-full space-y-2">
                                                <label className="text-xs font-bold text-zinc-500 uppercase ml-1">Nombre</label>
                                                <input type="text" value={newAppName} onChange={(e) => setNewAppName(e.target.value)} placeholder="Nombre del proyecto..." className="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3.5 text-zinc-100 focus:outline-none focus:ring-2 focus:ring-zinc-700 placeholder-zinc-700 transition-all font-medium" autoFocus />
                                            </div>
                                            <div className="w-full sm:w-48 space-y-2">
                                                <label className="text-xs font-bold text-zinc-500 uppercase ml-1">Plataforma</label>
                                                <div className="flex bg-zinc-950 p-1.5 rounded-xl border border-zinc-800">
                                                    {['App', 'PWA'].map((type) => (
                                                        <button key={type} type="button" onClick={() => setNewAppType(type)} className={`flex-1 flex items-center justify-center gap-2 py-2.5 text-sm font-bold rounded-lg transition-all ${newAppType === type ? 'bg-zinc-800 text-white shadow-md' : 'text-zinc-500 hover:text-zinc-300 hover:bg-zinc-900'}`}>{type === 'PWA' ? <Icons.Globe size={16} /> : <Icons.Smartphone size={16} />} {type}</button>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                        {activeTab === 'ideas' && (
                                            <div className="space-y-2 animate-in fade-in">
                                                <label className="text-xs font-bold text-zinc-500 uppercase ml-1">Descripción Rápida</label>
                                                <textarea value={newAppDesc} onChange={(e) => setNewAppDesc(e.target.value)} placeholder="Describe el concepto..." className="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-zinc-300 focus:outline-none focus:ring-2 focus:ring-zinc-700 placeholder-zinc-800 h-24 resize-none" />
                                            </div>
                                        )}
                                        {activeTab === 'apps' && (
                                            <div className="space-y-2 animate-in fade-in w-full sm:w-1/3">
                                                <label className="text-xs font-bold text-zinc-500 uppercase ml-1">Versión Inicial</label>
                                                <input type="text" value={newAppVersion} onChange={(e) => setNewAppVersion(e.target.value)} placeholder="Ej. v0.1.0" className="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-zinc-300 focus:outline-none focus:ring-2 focus:ring-zinc-700 placeholder-zinc-800" />
                                            </div>
                                        )}
                                        <button type="submit" disabled={!newAppName.trim()} className="w-full sm:w-auto self-end px-8 py-4 bg-white hover:bg-zinc-200 text-black font-bold rounded-xl disabled:opacity-50 disabled:cursor-not-allowed transition-all shadow-xl hover:shadow-white/10 active:scale-95">
                                            {activeTab === 'ideas' ? 'Guardar Idea' : 'Crear Proyecto'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        )}

                        {viewMode === 'dashboard' ? <Dashboard apps={apps} /> : (
                            <div className="grid grid-cols-1 gap-6 w-full">
                                {viewMode === 'list' ? (
                                    <>
                                        {visibleItems.map(app => (
                                            <AppCard key={app.id} app={app} onDelete={setAppToDelete} onUpdate={handleUpdateApp} onPromote={handlePromoteIdea} onArchive={handleArchiveIdea} onRevert={handleRevertIdea} onLaunch={handleLaunchApp} />
                                        ))}
                                        {visibleItems.length === 0 && !isFormOpen && (
                                            <div className="col-span-full py-24 flex flex-col items-center justify-center text-center border-2 border-dashed border-zinc-900 rounded-3xl bg-zinc-950/30">
                                                <h3 className="text-xl font-bold text-zinc-300 mb-2">Sección Vacía</h3>
                                                <p className="text-zinc-500">
                                                    {activeTab === 'production' ? 'Lanza proyectos desde "En Curso" para verlos aquí.' : 'No hay elementos en esta etapa.'}
                                                </p>
                                            </div>
                                        )}
                                    </>
                                ) : (
                                    <div className="flex gap-6 h-full items-start overflow-x-auto pb-4 px-1 snap-x snap-mandatory">
                                        {Object.entries(kanbanColumns).map(([stage, col]) => (
                                            <div
                                                key={stage}
                                                onDragOver={handleDragOver}
                                                onDrop={(e) => handleDrop(e, stage)}
                                                className={`min-w-[320px] w-full max-w-sm flex-shrink-0 bg-zinc-900/30 rounded-2xl border ${col.border} flex flex-col h-full max-h-[calc(100vh-200px)] snap-center`}
                                            >
                                                <div className={`p-4 border-b ${col.border} ${col.bg} rounded-t-2xl flex items-center justify-between sticky top-0 backdrop-blur-md z-20`}>
                                                    <h3 className={`font-bold ${col.color} flex items-center gap-2`}><col.icon size={18} /> {col.title}</h3>
                                                    <span className="text-xs font-mono bg-zinc-950 px-2 py-0.5 rounded border border-zinc-800 text-zinc-500">{col.items.length}</span>
                                                </div>
                                                <div className="p-4 flex-1 overflow-y-auto space-y-4 scrollbar-thin scrollbar-thumb-zinc-800 scrollbar-track-transparent">
                                                    {col.items.map(app => (
                                                        <AppCard key={app.id} app={app} onDelete={setAppToDelete} onUpdate={handleUpdateApp} onPromote={handlePromoteIdea} onArchive={handleArchiveIdea} onRevert={handleRevertIdea} onLaunch={handleLaunchApp} onDragStart={handleDragStart} />
                                                    ))}
                                                    {col.items.length === 0 && (
                                                        <div className="py-12 text-center border-2 border-dashed border-zinc-800/50 rounded-xl">
                                                            <p className="text-zinc-600 text-xs italic">Arrastra items aquí</p>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    <footer className="text-center py-6 text-zinc-600 text-[10px] font-bold footer-credit">
                        By: <span className="text-zinc-400">MöLDEA.STUDIO</span>
                    </footer>

                    <Modal isOpen={!!appToDelete} onClose={() => setAppToDelete(null)} onConfirm={() => { if (appToDelete) { setApps(apps.filter(a => a.id !== appToDelete.id)); setAppToDelete(null); } }} title="¿Eliminar elemento?" message={`Estás a punto de eliminar "${appToDelete?.name}".`} />
                    <Modal isOpen={!!pendingAction} onClose={() => setPendingAction(null)} onConfirm={() => { if (pendingAction?.action) pendingAction.action(); }} title={pendingAction?.title || ''} message={pendingAction?.message || ''} />
                </div>
            );
        };

        window.addEventListener('load', () => {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        });
    </script>
</body>

</html>
